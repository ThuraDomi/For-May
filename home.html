<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For May ❤️</title>

    <link rel="stylesheet" href="home.css">

</head>


<body>

    <main class="letter-page">


        <div class="background-light"></div>


        <header class="page-title">

            <h1>
                A Letter For You ❤️
            </h1>

            <p>
                MAY
            </p>

        </header>


        <!-- Background hearts -->

        <span class="background-heart heart-a">
            ♥
        </span>

        <span class="background-heart heart-b">
            ♥
        </span>

        <span class="background-heart heart-c">
            ♥
        </span>

        <span class="background-heart heart-d">
            ♥
        </span>



        <section class="letter-area" id="letterArea">


            <!-- Heart notes -->

            <div class="heart-note note-one">

                <span>
                    JULY<br>25
                </span>

            </div>


            <div class="heart-note note-two">

                <span>
                    BRIGHT<br>EYES
                </span>

            </div>


            <div class="heart-note note-three">

                <span>
                    OUR<br>FUTURE
                </span>

            </div>


            <div class="heart-note note-four">

                <span>
                    M + T
                </span>

            </div>



            <!-- Envelope -->

            <div class="envelope" id="envelope">


                <div class="envelope-back"></div>



                <!-- PAPER -->

                <article class="letter-paper" id="letterPaper">


                    <h2 class="letter-heading" id="letterHeading">
                        My Dear May,
                    </h2>


                    <div class="letter-text" id="letterText"></div>


                    <div class="signature" id="signature">
                        I LOVE YOU MAY ❤️
                    </div>
                    <button class="next-page-button" id="nextPageButton">
                        Our Memories →
                    </button>


                </article>



                <!-- Envelope front -->

                <div class="envelope-front"></div>

                <div class="bottom-fold"></div>

                <div class="envelope-flap"></div>


                <div class="heart-seal">
                    ♥
                </div>


            </div>



            <div class="tap-message" id="tapMessage">
                TAP THE ENVELOPE ♡
            </div>


        </section>


    </main>


    <script src="home.js"></script>

</body>

</html>
