<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memories ❤️</title>
  <link rel="stylesheet" href="memories.css">
</head>
<body>
<main class="memories-page">
  <div class="background-glow glow-left"></div>
  <div class="background-glow glow-right"></div>

  <header class="hero-text">
    <p class="eyebrow">M + T</p>
    <h1>Our Memories ❤️</h1>
    <p class="subtitle">Little moments I never want to forget</p>
  </header>

  <div class="decorations" aria-hidden="true">
    <span class="heart h1">♥</span><span class="heart h2">♥</span>
    <span class="heart h3">♥</span><span class="heart h4">♥</span>
    <span class="flower f1">✿</span><span class="flower f2">❀</span>
    <span class="flower f3">✿</span><span class="flower f4">❀</span>
  </div>

  <section class="timeline">
    <article class="memory-card card-1">
      <div class="timeline-number">01</div>
      <div class="photo-shell">
        <img src="images/photo1.jpg" alt="Us at the Regional Ceremony" class="memory-photo">
        <div class="photo-glass"></div>
      </div>
      <div class="cloud" aria-hidden="true">
        <span class="cloud-piece cp1"></span><span class="cloud-piece cp2"></span>
        <span class="cloud-piece cp3"></span><span class="cloud-piece cp4"></span>
      </div>
      <div class="caption-card">
        <span class="tiny-heart">♥</span>
        <h2>Us at the Regional Ceremony</h2>
      </div>
    </article>

    <article class="memory-card card-2">
      <div class="timeline-number">02</div>
      <div class="photo-shell">
        <img src="images/photo2.jpg" alt="Us at the O Pote Pwal" class="memory-photo">
        <div class="photo-glass"></div>
      </div>
      <div class="cloud" aria-hidden="true">
        <span class="cloud-piece cp1"></span><span class="cloud-piece cp2"></span>
        <span class="cloud-piece cp3"></span><span class="cloud-piece cp4"></span>
      </div>
      <div class="caption-card">
        <span class="tiny-heart">♥</span>
        <h2>Us at the O Pote Pwal</h2>
      </div>
    </article>

    <article class="memory-card card-3">
      <div class="timeline-number">03</div>
      <div class="photo-shell">
        <img src="images/photo3.jpg" alt="Us at our first ceremony" class="memory-photo">
        <div class="photo-glass"></div>
      </div>
      <div class="cloud" aria-hidden="true">
        <span class="cloud-piece cp1"></span><span class="cloud-piece cp2"></span>
        <span class="cloud-piece cp3"></span><span class="cloud-piece cp4"></span>
      </div>
      <div class="caption-card">
        <span class="tiny-heart">♥</span>
        <h2>Us at our first ceremony</h2>
      </div>
    </article>
  </section>

  <footer class="ending">
    <div class="ending-line"></div>
    <p>And I hope there will be countless more memories after these.</p>
    <h3>I LOVE YOU MAY ❤️</h3>
  </footer>
</main>

<script src="memories.js"></script>
</body>
</html>
